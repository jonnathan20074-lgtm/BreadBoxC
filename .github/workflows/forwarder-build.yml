# Lean build for the forwarder test: toolchain check + 3DSX/CIA only
# (no size gates, layout check or host tests). Run it by hand from the Actions tab.
name: forwarder-build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      BB_BUILD_JOBS: 3
      BASELINE_BUILD_REFERENCE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Toolchain matches toolchain.lock
        run: tools/build/container.sh bash tools/build/ci.sh toolchain

      - name: Build 3DSX and CIA
        run: tools/build/container.sh bash tools/build/ci.sh build

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: breadbox-forwarder-${{ github.sha }}
          path: |
            artifacts/*.cia
            artifacts/*.3dsx
          if-no-files-found: error
